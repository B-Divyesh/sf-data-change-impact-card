[package]
name = "data-change-impact-card"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explain downstream data staleness before recomputation"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-data-change-impact-card"
keywords = ["lineage", "data-engineering", "cli", "impact-analysis"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", ".factory/demo.md"]

[[bin]]
name = "dcic"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
